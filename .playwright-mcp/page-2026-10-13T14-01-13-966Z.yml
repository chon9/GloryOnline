              - definition [ref=f5e504]: 每年第一周举行，周五到周日，为期3天。性质为表演赛。
              - list [ref=f5e505]:
                - listitem [ref=f5e506]: 正规赛
              - definition [ref=f5e508]: 常规38周+16天季后赛+常规季后间假一周+年假一周+全明星一周+夏季转会8周
              - list [ref=f5e509]:
                - listitem [ref=f5e510]: 线下赛
              - definition [ref=f5e512]: 20队四组，组内单循环赛制，积分前两名出线，八强淘汰赛三周定胜负。
              - heading "赛况" [level=3] [ref=f5e514]
              - list [ref=f5e515]:
                - listitem [ref=f5e516]: 第一赛季：嘉世VS皇风 冠军：嘉世
              - definition [ref=f5e518]: 皇风经此一役走下坡，直到初代王牌退役，从此跌落神坛沦为二流。
              - list [ref=f5e519]:
                - listitem [ref=f5e520]: 第二赛季：嘉世VS霸图 冠军：嘉世
              - definition [ref=f5e522]: 宿命的死敌首次在最高舞台相杀。
              - list [ref=f5e523]:
                - listitem [ref=f5e524]: 第三赛季：嘉世VS百花 冠军：嘉世
              - definition [ref=f5e526]: 最土的打法挑翻魔术师，一杆却邪破百花，单人挑破繁花血景成就嘉世王朝，繁花血景也因过度运用，被叶秋研究透彻。
              - list [ref=f5e527]:
                - listitem [ref=f5e528]: 第四赛季：霸图VS嘉世 冠军：霸图
              - definition [ref=f5e530]: 霸图经典战，黄金一代出世，张新杰一战成名，季冷天外飞仙刺斗神，霸图打破王朝传说。
              - list [ref=f5e531]:
                - listitem [ref=f5e532]: 第五赛季：微草VS百花 冠军：微草
              - definition [ref=f5e534]: 收放自如，随时保持神级强度的魔术师震撼职业圈。
              - list [ref=f5e535]:
                - listitem [ref=f5e536]: 第六赛季：蓝雨VS微草 冠军：蓝雨
              - definition [ref=f5e538]: 喻文州的战术、黄少天的垃圾话，绝杀逆转，两大豪门成为死敌，连王杰希都有阴影。
              - list [ref=f5e539]:
                - listitem [ref=f5e540]: 第七赛季：微草VS百花 冠军：微草
              - definition [ref=f5e542]: 微草前次毫厘之失，差之千里，虽胜仍憾，只因险些成就新一代王朝。
              - list [ref=f5e543]:
                - listitem [ref=f5e544]: 第八赛季：轮回VS蓝雨 冠军：轮回
              - definition [ref=f5e546]: 其实都赖叶修瞎jb卖技能点攻略黄少天表示：我什么也不想说。
              - list [ref=f5e547]:
                - listitem [ref=f5e548]: 第九赛季：轮回VS霸图 冠军：轮回
              - definition [ref=f5e550]: 张佳乐哭晕在厕所。
              - list [ref=f5e551]:
                - listitem [ref=f5e552]: 第十赛季：兴欣VS轮回 冠军：兴欣
              - definition [ref=f5e554]: 十年荣耀，一如既往。
