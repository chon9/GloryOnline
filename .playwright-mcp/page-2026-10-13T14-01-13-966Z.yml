                    - cell [ref=f5e143]:
                      - text: 《
                      - link "全职高手" [ref=f5e144] [cursor=pointer]:
                        - /url: /%E5%85%A8%E8%81%8C%E9%AB%98%E6%89%8B
                      - text: 》
              - paragraph [ref=f5e145]:
                - text: 《荣耀》（Glory）是小说《
                - link "全职高手" [ref=f5e146] [cursor=pointer]:
                  - /url: /%E5%85%A8%E8%81%8C%E9%AB%98%E6%89%8B
                - text: 》的背景游戏，小说全部剧情都是围绕《荣耀》以及荣耀职业竞技而展开的。荣耀网络游戏的操作体验和世界观类似于第一人称3D版的“
                - link "暗黑破坏神" [ref=f5e147] [cursor=pointer]:
                  - /url: /%E6%9A%97%E9%BB%91%E7%A0%B4%E5%9D%8F%E7%A5%9E2
                - text: ”。其职业及技能主要取材于
                - link "DNF" [ref=f5e148] [cursor=pointer]:
                  - /url: /%E5%9C%B0%E4%B8%8B%E5%9F%8E%E4%B8%8E%E5%8B%87%E5%A3%AB
                - text: ，还引入了
                - link "龙之谷" [ref=f5e149] [cursor=pointer]:
                  - /url: /%E9%BE%99%E4%B9%8B%E8%B0%B7
                - text: 的怪物仇恨系统和
                - link "魔兽世界" [ref=f5e150] [cursor=pointer]:
                  - /url: /%E9%AD%94%E5%85%BD%E4%B8%96%E7%95%8C
                - text: 的公会战，并在其基础上展开了更加庞大的游戏设定。
              - paragraph [ref=f5e151]: 荣耀网游于十年前开服，每一年都会新增一个区，不同区的玩家不能互相串门。到达一定等级并完成挑战任务的可以来到公共区“神之领域”，神之领域拥有比普通区更大的面积，更多的副本，更丰富的材料，吸引着无数的玩家。
              - paragraph [ref=f5e152]:
                - text: 第十区开服之际，离开嘉世的叶修使用了当初
                - link "苏沐秋" [ref=f5e153] [cursor=pointer]:
                  - /url: /%E8%8B%8F%E6%B2%90%E7%A7%8B
                - text: 留下的
                - link "初版账号卡" [ref=f5e154] [cursor=pointer]:
                  - /url: /%E5%90%9B%E8%8E%AB%E7%AC%91
                - text: ，转区后来到第十区
                - superscript [ref=f5e155]:
                  - link "[1]" [ref=f5e156] [cursor=pointer]:
                    - /url: "#cite_note-1"
                - text: ，从零开始打拼。故事就从此开始了。
              - heading "角色卡" [level=2] [ref=f5e158]
              - figure [ref=f5e159]:
                - link [ref=f5e160] [cursor=pointer]:
                  - /url: /File:Glory-logo.gif
              - paragraph [ref=f5e162]: 荣耀游戏的账号是一张卡片，荣耀账号卡因包含有全部角色的设定和信息，相当于一个独立的个体，又被称之为角色卡。荣耀角色卡和其操作者（选手）是作品中最重要的设定。
              - paragraph [ref=f5e163]: 因荣耀账号是实卡，所以必须配备专用的登录器才能登入游戏。虽然这一人一卡一号的机制有效的遏制了资源浪费等情况，但还是有很多人买多张卡的情况。各大战队所属公会都会养着一批野号，以方便做一些上不了台面的事情。
              - paragraph [ref=f5e164]: 职业选手和俱乐部签订合同后，角色卡也就成了俱乐部所属，不再是个人之物了。
              - paragraph [ref=f5e165]: 角色卡的价值主要体现在这几方面： 1、技能点。荣耀账号的技能点是有上限的，如何能最大限度逼近上限是每家俱乐部都在钻研的难题。 2、角色装备。银装不一定是最好的装备，但最好的装备一定是自制银装。 3、角色的人气或者操作者本身的名气和人格魅力，但当角色卡易主后就会逐渐失去。如张佳乐退役后，因百花缭乱的人气，将技术平平的继任者也推向了全明星的舞台。
              - paragraph [ref=f5e166]: 选手可以转会，角色卡也能转会，只是角色卡的转会更多的被称之为收购，一般买家看中的主要就是以上三点。当然也有土豪只看中装备，所以这种收购的结果就是角色被扒光，拆解，最后陨落。比如沾衣乱飞和慧剑锋芒。
              - paragraph [ref=f5e167]: 目前屹立于荣耀顶端的角色有：
              - list [ref=f5e168]:
                - listitem [ref=f5e169]: 斗神 • 一叶之秋
                - listitem [ref=f5e170]: 拳皇 • 大漠孤烟
                - listitem [ref=f5e171]: 枪王 • 一枪穿云
                - listitem [ref=f5e172]: 剑圣 • 夜雨声烦
                - listitem [ref=f5e173]: 魔术师 • 王不留行&王杰希
                - listitem [ref=f5e174]: ？？？ • 扫地焚香（郭明宇>？？？>田森）【该角色可视为已跌下神坛，但确为荣耀初期三大神级角色之一，另外两个角色分别为一叶之秋和大漠孤烟】<严格来说这个不算目前
