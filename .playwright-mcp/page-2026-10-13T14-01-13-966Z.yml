              - paragraph [ref=f5e557]: 由世界电子竞技协会携手荣耀游戏公司共同发起，对十六个拥有荣耀职业联赛的国家发出邀请，进行的世界性荣耀大赛。中国国家电子竞技总局和荣耀职业联盟联合对国内精英选手进行抽调组成。
