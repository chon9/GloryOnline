              - heading "装备" [level=2] [ref=f5e456]
              - paragraph [ref=f5e457]: 荣耀装备的等阶可以通过字色分橙紫蓝绿白这五种。白装无附加属性，绿装多是任务给的过渡装，蓝装副本BOSS必掉，一些任务也有，是比重最大的主流装备。而紫装和橙装就属于高级的装备，或人品或金钱，总要有点突出的地方才有可能获得。
              - paragraph [ref=f5e458]: 而除了这五色。荣耀还有一种银色，那是自制装备的独有字色。自制装备是荣耀的一大特色，并不是游戏中的生活制造技能，而是靠游戏的一个装备编辑器做出的装备，属于高端内容。
              - paragraph [ref=f5e459]: 原文中有提到斩楼兰的武器斩锋是65级粉武，但后文从未再提起过粉阶装备，目前尚无定论，八成是搞错了
              - paragraph [ref=f5e460]: 在荣耀中有一句流传很广的话：自制装备未必是最强的，但最强的装备一定是自制的。自制装备，正是可以超越史诗级橙字装备的存在，在职业联盟中，各俱乐部都拥有专门研究自制装备的团队，投入资金研究自制装备。斗神一叶之秋，手中握着的战矛却邪，就是荣耀中赫赫有名的一把银武。
              - paragraph [ref=f5e461]: 每一件银装的名字不是自己起的，而是系统根据其特点自动生成的，自制装备的特点，决定了它很难复制，每一件都是独一无二。 只不过它有可能是一件独一无二超越史诗的巅峰之作，也有可能是一件独一无二的垃圾。
              - paragraph [ref=f5e462]:
                - text: 说是无法复制但其实是因为没有设计图所以别人无法复制，只要有设计图就是可以复制的，比如却邪就有三杆，一杆给一叶之秋用，另外两杆给装备研发部
                - deletion [ref=f5e463]: 糟蹋
                - text: 用来研发提升思路，再比如对阵青之驱的时候叶修带了一把5级的千机伞用来应付驱魔师的75级技能封禁符，在5级的千机伞被贴了封条以后继续用70级的千机伞打架。
              - heading "荣耀竞技联盟" [level=2] [ref=f5e465]
              - paragraph [ref=f5e466]: 荣耀竞技联盟赛事每年举办一次。在小说刚开始时，正在举办荣耀联赛第八赛季，主角叶修带领的嘉世战队在第一、第二、第三赛季中三连冠，第四赛季被霸图战队打下擂台，第五及第七赛季冠军为微草战队，第六赛季冠军为蓝雨战队，第八、第九赛季因为叶修卖攻略的原因被轮回战队蝉联。
              - list [ref=f5e467]:
